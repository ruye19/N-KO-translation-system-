        - text: Save the page when done (
        - code [ref=e26]: Ctrl + S
        - text: ), or copy each answer into a plain text file numbered to match.
    - paragraph [ref=e27]: A mapping will only be derived after the answers come back, and only where a transcription aligns unambiguously with its codepoint sequence. Anything ambiguous stays UNKNOWN, and every derived mapping must then be cross-validated against entries the reviewer has not seen.
